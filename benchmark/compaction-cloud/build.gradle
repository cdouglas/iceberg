plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

description = 'Compaction Cloud Benchmark for Apache Iceberg'

dependencies {
    implementation project(':iceberg-api')
    implementation project(':iceberg-core')
    implementation project(':iceberg-bundled-guava')

    implementation libs.avro.avro

    // Jackson for YAML/JSON
    implementation libs.jackson.core
    implementation libs.jackson.databind
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'

    // Logging
    implementation libs.slf4j.api
    runtimeOnly libs.slf4j.simple

    // Test dependencies
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
    testImplementation libs.assertj.core
}

jar {
    manifest {
        attributes 'Main-Class': 'org.apache.iceberg.benchmark.cloud.CompactionCloudBenchmark'
    }
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'org.apache.iceberg.benchmark.cloud.CompactionCloudBenchmark'
    }
}

test {
    useJUnitPlatform()
}
