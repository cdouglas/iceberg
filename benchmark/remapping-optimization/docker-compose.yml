# Docker Compose for JMH Remapping Benchmarks
#
# Usage:
#   docker compose build                    # Build the image
#   docker compose run benchmark            # Run default benchmarks
#   docker compose run benchmark-quick      # Run quick benchmarks
#   docker compose run benchmark-full       # Run full suite
#
# Results are stored in the 'benchmark-results' named volume.
# To access results:
#   docker compose run --rm shell ls /benchmark/results
#   docker run --rm -v iceberg-jmh-benchmark-results:/data alpine ls /data
#
# To copy results out:
#   docker run --rm -v iceberg-jmh-benchmark-results:/data -v $(pwd):/out alpine cp -r /data /out/results
#
# To clean up:
#   docker compose down -v                  # Remove containers and volumes

services:
  # Default benchmark with moderate settings
  benchmark:
    build:
      context: ../..
      dockerfile: benchmark/remapping-optimization/Dockerfile
    volumes:
      - benchmark-results:/benchmark/results
    environment:
      - JAVA_OPTS=-Xms2g -Xmx2g -XX:+UseG1GC
    # Default: moderate iterations (~45 min)
    command: ["RemappingAlgorithmBenchmark", "-wi", "3", "-i", "5", "-f", "2", "-rf", "json", "-rff", "/benchmark/results/results.json"]

  # Quick benchmark for testing (~10-15 min)
  benchmark-quick:
    build:
      context: ../..
      dockerfile: benchmark/remapping-optimization/Dockerfile
    volumes:
      - benchmark-results:/benchmark/results
    environment:
      - JAVA_OPTS=-Xms2g -Xmx2g -XX:+UseG1GC
    command: ["RemappingAlgorithmBenchmark", "-wi", "1", "-i", "2", "-f", "1", "-rf", "json", "-rff", "/benchmark/results/results-quick.json"]

  # Full benchmark suite (~2-3 hours)
  benchmark-full:
    build:
      context: ../..
      dockerfile: benchmark/remapping-optimization/Dockerfile
    volumes:
      - benchmark-results:/benchmark/results
    environment:
      - JAVA_OPTS=-Xms4g -Xmx4g -XX:+UseG1GC
    command: ["RemappingAlgorithmBenchmark", "-wi", "5", "-i", "10", "-f", "3", "-rf", "json", "-rff", "/benchmark/results/results-full.json"]

  # Smart selector only (for validating selector logic)
  benchmark-selector:
    build:
      context: ../..
      dockerfile: benchmark/remapping-optimization/Dockerfile
    volumes:
      - benchmark-results:/benchmark/results
    environment:
      - JAVA_OPTS=-Xms2g -Xmx2g -XX:+UseG1GC
    command: ["RemappingAlgorithmBenchmark.smartSelector", "-wi", "3", "-i", "5", "-f", "2", "-rf", "json", "-rff", "/benchmark/results/results-selector.json"]

  # Analysis container - runs Python analysis on results
  analyze:
    build:
      context: ../..
      dockerfile: benchmark/remapping-optimization/Dockerfile
    volumes:
      - benchmark-results:/benchmark/results
    entrypoint: ["python3"]
    command: ["analyze_results.py", "/benchmark/results/results.json"]

  # Interactive shell for exploring results
  shell:
    build:
      context: ../..
      dockerfile: benchmark/remapping-optimization/Dockerfile
    volumes:
      - benchmark-results:/benchmark/results
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

volumes:
  benchmark-results:
    name: iceberg-jmh-benchmark-results
