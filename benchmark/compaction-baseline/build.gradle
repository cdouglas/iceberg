plugins {
  id 'java'
  id 'com.gradleup.shadow'
}

description = 'Compaction Baseline Benchmark (DV reconciliation: baseline rewrite vs. compaction-map remap)'

// This module is dev-only; it hard-targets Spark 3.5 + Scala 2.12 (the default build config).
// Building with -PsparkVersions excluding 3.5 will fail to resolve the iceberg-spark project.
String scalaVersion = System.getProperty("scalaVersion") != null ? System.getProperty("scalaVersion") : System.getProperty("defaultScalaVersion")

dependencies {
  implementation project(':iceberg-api')
  implementation project(':iceberg-core')
  implementation project(':iceberg-parquet')
  implementation project(':iceberg-data')
  // Iceberg's relocated Guava (Lists, Sets, Maps, Preconditions, etc.) is required by checkstyle.
  implementation project(path: ':iceberg-bundled-guava', configuration: 'shadow')

  // Iceberg-Spark integration (SparkActions.rewriteDataFiles, SparkCompactionConflictResolver).
  implementation project(":iceberg-spark:iceberg-spark-3.5_${scalaVersion}")
  implementation project(":iceberg-spark:iceberg-spark-extensions-3.5_${scalaVersion}")

  // Apache Spark itself. Excludes mirror those in spark/v3.5/build.gradle to avoid arrow/parquet
  // version conflicts.
  implementation("org.apache.spark:spark-hive_${scalaVersion}:${libs.versions.spark35.get()}") {
    exclude group: 'org.apache.avro', module: 'avro'
    exclude group: 'org.apache.arrow'
    exclude group: 'org.apache.parquet'
    exclude group: 'io.netty', module: 'netty-buffer'
    exclude group: 'io.netty', module: 'netty-common'
    exclude group: 'org.roaringbitmap'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
  }

  // Jackson for setup_manifest.json + results.jsonl serialization.
  implementation platform(libs.jackson.bom)
  implementation libs.jackson.databind

  // Roaring bitmaps for deletion vector construction
  implementation libs.roaringbitmap

  // Hadoop common required by HadoopTables / HadoopCatalog
  implementation(libs.hadoop3.common) {
    exclude group: 'log4j', module: 'log4j'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
  }

  // Logging
  implementation libs.slf4j.api
  runtimeOnly libs.slf4j.simple

  // Required by Parquet for reading/writing files
  runtimeOnly(libs.hadoop3.mapreduce.client.core) {
    exclude group: 'log4j', module: 'log4j'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
  }

  // Testing
  testImplementation libs.junit.jupiter
  testRuntimeOnly libs.junit.jupiter.engine
  testImplementation libs.assertj.core
  // mockito-inline supports MockedConstruction, which M4 uses to intercept the resolver's
  // internal `new PositionDeleteRemapper(...)` call.
  testImplementation libs.mockito.inline
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  // Suppress ErrorProne warnings for benchmark code (matches remapping-microbenchmark).
  options.errorprone {
    disable("DefaultLocale")
    disable("UnusedVariable")
    disable("StringSplitter")
  }
}

test {
  useJUnitPlatform()
}

jar {
  manifest {
    attributes 'Main-Class': 'org.apache.iceberg.benchmark.compaction.RunMain'
  }
}

shadowJar {
  archiveClassifier.set('')
  zip64 = true
  mergeServiceFiles()
  manifest {
    attributes 'Main-Class': 'org.apache.iceberg.benchmark.compaction.RunMain'
  }
}
