plugins {
  id 'java'
  id 'com.gradleup.shadow'
}

description = 'Remapping Microbenchmark for Compaction Maps'

dependencies {
  implementation project(':iceberg-api')
  implementation project(':iceberg-core')
  implementation project(':iceberg-parquet')
  implementation project(':iceberg-data')

  // Configuration parsing
  implementation platform(libs.jackson.bom)
  implementation libs.jackson.databind
  implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

  // Parquet dependencies (for MessageType class)
  implementation libs.parquet.column

  // Roaring bitmaps for deletion vectors
  implementation libs.roaringbitmap

  // Hadoop common for HadoopConfigurable interface used by ResolvingFileIO
  implementation(libs.hadoop3.common) {
    exclude group: 'log4j', module: 'log4j'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
  }

  // Cloud storage support via Iceberg FileIO
  // Include both the FileIO implementations AND their dependency bundles
  runtimeOnly project(':iceberg-aws')
  runtimeOnly project(':iceberg-gcp')
  runtimeOnly project(':iceberg-azure')
  // Bundles provide shaded cloud SDK dependencies
  runtimeOnly project(':iceberg-aws-bundle')
  runtimeOnly project(':iceberg-gcp-bundle')
  runtimeOnly project(':iceberg-azure-bundle')

  // Logging
  implementation libs.slf4j.api
  runtimeOnly libs.slf4j.simple

  // Required by Parquet for reading/writing files
  runtimeOnly(libs.hadoop3.mapreduce.client.core) {
    exclude group: 'log4j', module: 'log4j'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
  }

  // Testing
  testImplementation libs.junit.jupiter
  testRuntimeOnly libs.junit.jupiter.engine
  testImplementation libs.assertj.core
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  // Suppress ErrorProne warnings for benchmark code
  options.errorprone {
    disable("DefaultLocale")
    disable("UnusedVariable")
    disable("StringSplitter")
  }
}

test {
  useJUnitPlatform {
    // Exclude integration tests by default
    excludeTags 'integration'
  }
}

// Separate task for integration tests - requires cloud credentials
tasks.register('integrationTest', Test) {
  group = 'verification'
  description = 'Run cloud storage integration tests. Requires GCS_TEST_BUCKET, S3_TEST_BUCKET, or AZURE_TEST_URI env vars.'

  useJUnitPlatform {
    includeTags 'integration'
  }

  // Pass through environment variables
  environment 'GCS_TEST_BUCKET', System.getenv('GCS_TEST_BUCKET') ?: ''
  environment 'S3_TEST_BUCKET', System.getenv('S3_TEST_BUCKET') ?: ''
  environment 'AZURE_TEST_URI', System.getenv('AZURE_TEST_URI') ?: ''
}

jar {
  manifest {
    attributes 'Main-Class': 'org.apache.iceberg.benchmark.remapping.RemappingMicrobenchmark'
  }
}

shadowJar {
  archiveClassifier.set('')
  zip64 = true
  mergeServiceFiles()
  manifest {
    attributes 'Main-Class': 'org.apache.iceberg.benchmark.remapping.RemappingMicrobenchmark'
  }
}

// Task to run the benchmark
tasks.register('runBenchmark', JavaExec) {
  group = 'benchmark'
  description = 'Run the remapping microbenchmark'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'org.apache.iceberg.benchmark.remapping.RemappingMicrobenchmark'

  // Default arguments, can be overridden with -PbenchmarkArgs="..."
  if (project.hasProperty('benchmarkArgs')) {
    args project.benchmarkArgs.split(' ')
  }
}
